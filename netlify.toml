# The site moved to Cloudflare at https://gerind.dev. This Netlify site only
# forwards old links there, keeping the path, in a single hop. gerind.dev itself
# handles old paths (CV file names, /blog) with its own _redirects.
[build]
  command = "pnpm build && rm -f dist/_redirects"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "https://gerind.dev/:splat"
  status = 301
  force = true
